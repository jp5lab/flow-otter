name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: typecheck + lint + unit + property
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Unit tests
        run: npm run test:unit

      - name: Property tests
        run: npm run test:property

      - name: Build
        run: npm run build

      - name: Tool coverage audit
        run: node scripts/check-tool-coverage.mjs

# Integration tests require Docker (Node-RED + Mosquitto). Run locally with:
#   npm run test:integration
# Enable a separate CI job here if/when CI runner Docker is wired up.
